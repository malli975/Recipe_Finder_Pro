<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Malli Gourmet Pro | Designer UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f4f7f6; }
        .sidebar { background: white; border-radius: 25px; padding: 30px; position: sticky; top: 20px; border: 1px solid #eee; }
        .recipe-card { border: none; border-radius: 30px; transition: 0.4s; background: white; overflow: hidden; height: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .recipe-card:hover { transform: translateY(-12px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
        .img-container { height: 230px; background: #e0e0e0; }
        .badge-tag { background: #fff9db; color: #f08c00; padding: 6px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; }
        .btn-danger { background: #ff4757; border: none; border-radius: 50px; padding: 12px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row">
        <aside class="col-lg-3 mb-4">
            <div class="sidebar shadow-sm">
                <h4 class="fw-bold mb-4">AI Filters</h4>
                <form action="/recommend" method="get">
                    <label class="small fw-bold text-muted mb-2">Ingredients</label>
                    <input type="text" name="ingredients" class="form-control mb-4 py-2 border-light bg-light" value="{{ query }}" required>
                    
                    <label class="small fw-bold text-muted mb-2">Lifestyle</label>
                    <select name="filter_type" class="form-select mb-4 border-light bg-light">
                        <option value="All" {% if filter_type == 'All' %}selected{% endif %}>All Recipes</option>
                        <option value="Healthy" {% if filter_type == 'Healthy' %}selected{% endif %}>Healthy Choice</option>
                        <option value="Fast Food Style" {% if filter_type == 'Fast Food Style' %}selected{% endif %}>Fast Food Style</option>
                    </select>

                    <label class="small fw-bold text-muted mb-2">Max Time: <span class="text-danger">{{ max_time or 60 }}m</span></label>
                    <input type="range" name="max_time" class="form-range mb-4" min="10" max="120" step="10" value="{{ max_time or 60 }}" oninput="this.previousElementSibling.firstElementChild.innerText = this.value + 'm'">
                    
                    <button class="btn btn-danger w-100 shadow">Update Search</button>
                </form>
            </div>
        </aside>

        <main class="col-lg-9">
            <div class="row">
                {% if recipes %}
                    {% for recipe in recipes %}
                    <div class="col-md-6 col-xl-4 mb-4">
                        <div class="card recipe-card">
                           <div class="img-container">
    <div class="img-container">
    <img src="https://loremflickr.com/500/400/food,{{ recipe.name.split()|last }}/all?sig={{ random(1, 99999) }}" 
         class="w-100 h-100" 
         style="object-fit: cover;"
         onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=60'">
</div>
                            <div class="card-body d-flex flex-column p-4">
                                <div class="d-flex justify-content-between mb-3 align-items-center">
                                    <span class="badge-tag">{{ recipe.difficulty }}</span>
                                    <small class="text-muted fw-bold">{{ recipe.minutes }} MIN</small>
                                </div>
                                <h5 class="fw-bold text-capitalize mb-4 flex-grow-1">{{ recipe.name }}</h5>
                                <button class="btn btn-dark w-100 rounded-pill py-2" data-bs-toggle="modal" data-bs-target="#m{{ loop.index }}">View Recipe</button>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="m{{ loop.index }}" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content p-4" style="border-radius: 35px; border: none;">
                                <h3 class="fw-bold mb-3 text-capitalize">{{ recipe.name }}</h3>
                                <div class="bg-light p-4 rounded-4 mb-4">
                                    <h6 class="fw-bold text-danger mb-2">Instructions</h6>
                                    <p class="small text-secondary mb-0" style="line-height: 1.6;">{{ recipe.steps }}</p>
                                </div>
                                <button class="btn btn-danger rounded-pill py-2" data-bs-dismiss="modal">Got it!</button>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="text-center py-5">
                        <h3 class="text-muted">Enter ingredients to see the AI magic!</h3>
                    </div>
                {% endif %}
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
